<div class="auth-wrapper" style="background-image: url('assets/images/background.webp');">
  <div class="auth-card login-card">
    <h1 class="auth-title text-center">Forgot Password</h1>
    <p class="auth-subtitle text-center">Recover your account using an email OTP.</p>

    <div *ngIf="message" class="alert alert-info">{{ message }}</div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <label class="form-label fw-semibold">Registered Email</label>
    <input class="form-control mb-3" type="email" [(ngModel)]="email"
      placeholder="Enter your registered email">

    <button class="btn btn-primary w-100 mb-3" type="button"
      (click)="sendOtp()" [disabled]="loading">
      {{ loading ? 'Sending...' : 'Send OTP' }}
    </button>

    <div *ngIf="otpSent">
      <label class="form-label fw-semibold">OTP</label>
      <input class="form-control mb-3" [(ngModel)]="otp"
        maxlength="6" inputmode="numeric" placeholder="Enter OTP">
      <button class="btn btn-success w-100 mb-3" type="button"
        (click)="verifyOtp()" [disabled]="loading">
        Verify OTP
      </button>
      <button class="btn btn-outline-secondary w-100 mb-3" type="button"
        (click)="resendOtp()" [disabled]="loading || resendCooldown > 0">
        <i class="bi bi-arrow-clockwise me-2"></i>
        {{ resendCooldown > 0 ? 'Resend OTP in ' + resendCooldown + 's' : 'Resend OTP' }}
      </button>
    </div>

    <a routerLink="/login" class="d-block text-center">Back to Login</a>
  </div>
</div>
