<div class="auth-wrapper" style="background-image: url('assets/images/background.webp');">
  <div class="auth-card login-card">
    <h1 class="auth-title text-center">Forgot Password</h1>
    <p class="auth-subtitle text-center">Recover your account using an email OTP.</p>

    <div *ngIf="message" class="alert alert-info">{{ message }}</div>
    <div *ngIf="success" class="alert alert-success">{{ success }}</div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

    <!-- OTP SECTION — visible only until the OTP is verified -->
    <ng-container *ngIf="!otpVerified">

      <label class="form-label fw-semibold">Registered Email</label>
      <input class="form-control mb-3" type="email" [(ngModel)]="email"
        [disabled]="loading"
        placeholder="Enter your registered email">

      <button class="btn btn-primary w-100 mb-3" type="button"
        (click)="sendOtp()" [disabled]="loading">
        {{ loading ? 'Sending...' : 'Send OTP' }}
      </button>

      <div *ngIf="otpSent">
        <label class="form-label fw-semibold">OTP</label>
        <input class="form-control mb-3" [(ngModel)]="otp"
          maxlength="6" inputmode="numeric" placeholder="Enter OTP"
          [disabled]="loading">
        <button class="btn btn-success w-100 mb-3" type="button"
          (click)="verifyOtp()" [disabled]="loading">
          Verify OTP
        </button>
        <button class="btn btn-outline-secondary w-100 mb-3" type="button"
          (click)="resendOtp()" [disabled]="loading || resendCooldown > 0">
          <i class="bi bi-arrow-clockwise me-2"></i>
          {{ resendCooldown > 0 ? 'Resend OTP in ' + resendCooldown + 's' : 'Resend OTP' }}
        </button>
      </div>

    </ng-container>

    <!-- NEW PASSWORD SECTION — shown only after successful OTP verification -->
    <div *ngIf="otpVerified">
      <label class="form-label fw-semibold">New Password</label>
      <div class="password-group mb-3">
        <input class="form-control" [type]="showPassword ? 'text' : 'password'"
          [(ngModel)]="newPassword" [disabled]="updating"
          placeholder="Enter your new password">
        <button type="button" class="password-toggle" (click)="showPassword = !showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          [attr.aria-pressed]="showPassword">
          <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>

      <label class="form-label fw-semibold">Confirm New Password</label>
      <div class="password-group mb-3">
        <input class="form-control" [type]="showConfirmPassword ? 'text' : 'password'"
          [(ngModel)]="confirmPassword" [disabled]="updating"
          placeholder="Re-enter your new password">
        <button type="button" class="password-toggle" (click)="showConfirmPassword = !showConfirmPassword"
          [attr.aria-label]="showConfirmPassword ? 'Hide confirm password' : 'Show confirm password'"
          [attr.aria-pressed]="showConfirmPassword">
          <i class="bi" [ngClass]="showConfirmPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
        </button>
      </div>

      <button class="btn btn-primary w-100 mb-3" type="button"
        (click)="updatePassword()" [disabled]="updating">
        <span *ngIf="updating" class="spinner-border spinner-border-sm me-1"></span>
        {{ updating ? 'Updating...' : 'Update Password' }}
      </button>
    </div>

    <a routerLink="/login" class="d-block text-center">Back to Login</a>
  </div>
</div>
