<!-- ==================================================
     INVESTTRACK USER NAVBAR
================================================== -->

<nav class="navbar navbar-expand-xl invest-navbar">

  <div class="container-fluid px-5">

    <!-- Brand -->

    <a
      class="navbar-brand invest-brand"
      routerLink="/usernav/home">

      <div class="brand-icon">
        <i class="bi bi-currency-exchange"></i>
      </div>

      <span class="brand-title">
        InvestTrack
      </span>

    </a>

    <!-- Mobile Toggle -->

    <button
      class="navbar-toggler custom-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#userNav"
      aria-controls="userNav"
      aria-expanded="false">

      <i class="bi bi-list"></i>

    </button>

    <!-- Navigation -->

    <div
      class="collapse navbar-collapse"
      id="userNav">

      <ul class="navbar-nav">

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/usernav/home"
            routerLinkActive="active">

            <i class="bi bi-grid-1x2-fill"></i>

            <span>Home</span>

          </a>

        </li>

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/usernav/view-investments"
            routerLinkActive="active">

            <i class="bi bi-graph-up-arrow"></i>

            <span>Investments</span>

          </a>

        </li>

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/usernav/view-inquiries"
            routerLinkActive="active">

            <i class="bi bi-headset"></i>

            <span>Inquiries</span>

          </a>

        </li>

        <li class="nav-item">

          <a
            class="nav-link"
            routerLink="/usernav/add-feedback"
            routerLinkActive="active">

            <i class="bi bi-stars"></i>

            <span>Feedback</span>

          </a>

        </li>

      </ul>

      <!-- User Menu -->

      <div class="dropdown user-dropdown-container ms-auto">

        <button
          type="button"
          class="user-menu-btn"
          data-bs-toggle="dropdown"
          aria-expanded="false">

          <div class="user-avatar">

            {{ username?.charAt(0) | uppercase }}

          </div>

          <div class="user-meta">

            <span class="user-name">

              {{ username }}

            </span>

            <span class="user-role-small">

              {{ userRole }}

            </span>

          </div>

          <i class="bi bi-chevron-down"></i>

        </button>

        <ul class="dropdown-menu dropdown-menu-end user-dropdown">

          <li>

            <div class="dropdown-user-info">

              <div class="dropdown-user-name">

                {{ username }}

              </div>

              <div class="dropdown-user-role">

                {{ userRole }}

              </div>

            </div>

          </li>

          <li>
            <hr class="dropdown-divider">
          </li>

          <li>

            <a
              class="dropdown-item"
              routerLink="/usernav/change-password">

              <i class="bi bi-shield-lock-fill me-2"></i>

              Change Password

            </a>

          </li>

          <li>

            <button
              type="button"
              class="dropdown-item logout-item"
              (click)="confirmLogout()">

              <i class="bi bi-box-arrow-right me-2"></i>

              Logout

            </button>

          </li>

        </ul>

      </div>

    </div>

  </div>

</nav>

<!-- ==================================================
     PAGE CONTENT
================================================== -->

<div class="container-fluid py-4 px-4">

  <router-outlet></router-outlet>

</div>

<!-- ==================================================
     LOGOUT MODAL
================================================== -->

<div
  class="modal fade"
  [class.show]="showLogoutModal"
  [style.display]="showLogoutModal ? 'block' : 'none'"
  tabindex="-1">

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content investtrack-modal">

      <div class="modal-header border-0">

        <h5 class="modal-title fw-bold">

          Confirm Logout

        </h5>

      </div>

      <div class="modal-body text-center">

        <div class="logout-icon mb-3">

          <i
            class="bi bi-box-arrow-right fs-1 text-danger">
          </i>

        </div>

        <p class="mb-0 fs-5">

          Are you sure you want to logout from
          InvestTrack?

        </p>

      </div>

      <div
        class="modal-footer border-0 justify-content-center">

        <button
          type="button"
          class="btn btn-outline-secondary"
          (click)="cancelLogout()">

          Cancel

        </button>

        <button
          type="button"
          class="btn btn-danger"
          (click)="onLogout()">

          Logout

        </button>

      </div>

    </div>

  </div>

</div>

<div
  *ngIf="showLogoutModal"
  class="modal-backdrop fade show">

</div>
