<div class="dropdown">

  <button
    type="button"
    class="notif-bell-btn"
    data-bs-toggle="dropdown"
    data-bs-display="static"
    aria-expanded="false"
    [attr.aria-label]="badgeLabel"
    [attr.title]="badgeLabel"
    (click)="onOpen()">

    <i class="bi bi-bell-fill" aria-hidden="true"></i>

    <span
      class="notif-badge"
      *ngIf="unreadCount > 0"
      aria-hidden="true">
      {{ badgeText }}
    </span>

  </button>

  <ul class="dropdown-menu dropdown-menu-end notif-dropdown">

    <li class="notif-header">
      <span class="notif-header-title">
        <i class="bi bi-bell" aria-hidden="true"></i>
        Notifications
      </span>
      <button
        type="button"
        class="notif-mark-all"
        *ngIf="unreadCount > 0 && !markingAll"
        (click)="$event.stopPropagation(); markAllRead()">
        Mark all read
      </button>
    </li>

    <li><hr class="dropdown-divider"></li>

    <li *ngIf="loading" class="notif-state">
      <span class="notif-spinner" aria-hidden="true"></span>
      Loading…
    </li>

    <li *ngIf="!loading && error" class="notif-state notif-error">
      {{ error }}
      <button type="button" class="notif-retry" (click)="load()">Retry</button>
    </li>

    <li *ngIf="!loading && !error && items.length === 0" class="notif-state">
      No notifications yet.
    </li>

    <li
      *ngFor="let notification of items"
      class="notif-item"
      [class.notif-item-unread]="!notification.read">
      <button
        type="button"
        class="notif-item-btn"
        (click)="open(notification)">

        <span class="notif-item-top">
          <span class="notif-item-title">{{ notification.title }}</span>
          <span
            class="notif-dot"
            *ngIf="!notification.read"
            [attr.aria-label]="'Unread'">
          </span>
        </span>

        <span class="notif-item-message">{{ notification.message }}</span>

        <span class="notif-item-meta">
          <span class="notif-type-badge">{{ notification.type }}</span>
          <span class="notif-item-time">{{ notification.createdAt | date: 'MMM d, h:mm a' }}</span>
        </span>

      </button>
    </li>

    <li *ngIf="items.length > 0"><hr class="dropdown-divider"></li>

    <li *ngIf="items.length > 0" class="notif-footer">
      <span class="notif-footer-hint">
        {{ unreadCount > 0 ? unreadCount + ' unread' : 'All caught up' }}
      </span>
      <button
        type="button"
        class="notif-mark-all"
        *ngIf="unreadCount > 0 && !markingAll"
        (click)="$event.stopPropagation(); markAllRead()">
        Mark all read
      </button>
    </li>

  </ul>

</div>
