<!-- ==========================================
     PAGE HEADER
========================================== -->

<div class="investment-header">

  <div class="header-content">

    <span class="header-tag">

      <i class="bi bi-pencil-square"></i>

      INVESTMENT MANAGEMENT

    </span>

    <h1>Edit Investment</h1>

    <p>
      Update investment information, pricing and portfolio details.
    </p>

  </div>

  <div class="header-icon">

    <i class="bi bi-graph-up-arrow"></i>

  </div>

</div>

<!-- ==========================================
     FORM
========================================== -->

<div class="investment-container">

  <form
    [formGroup]="editForm"
    (ngSubmit)="onUpdate()">

    <!-- BASIC DETAILS -->

    <div class="form-section">

      <h4>

        <i class="bi bi-info-circle-fill me-2"></i>

        Investment Information

      </h4>

      <div class="row g-3">

        <div class="col-md-6">

          <label class="form-label">

            Investment Name

          </label>

          <input
            type="text"
            class="form-control"
            formControlName="name"
            [class.is-invalid]="f['name'].invalid && f['name'].touched">

        </div>

        <div class="col-md-6">

          <label class="form-label">

            Investment Type

          </label>

          <select
            class="form-select"
            formControlName="type"
            [class.is-invalid]="f['type'].invalid && f['type'].touched">

            <option value="">Select Type</option>
            <option value="Stock">Stock</option>
            <option value="Crypto">Crypto</option>
            <option value="Real Estate">Real Estate</option>
            <option value="Mutual Fund">Mutual Fund</option>
            <option value="Bond">Bond</option>

          </select>

        </div>

        <div class="col-12">

          <label class="form-label">

            Description

          </label>

          <textarea
            rows="4"
            class="form-control"
            formControlName="description"
            [class.is-invalid]="f['description'].invalid && f['description'].touched">

          </textarea>

        </div>

      </div>

    </div>

    <!-- PRICING -->

    <div class="form-section">

      <h4>

        <i class="bi bi-cash-stack me-2"></i>

        Pricing Information

      </h4>

      <div class="row g-3">

        <div class="col-md-4">

          <label class="form-label">

            Purchase Price

          </label>

          <input
            type="number"
            step="0.01"
            class="form-control"
            formControlName="purchasePrice">

        </div>

        <div class="col-md-4">

          <label class="form-label">

            Current Price

          </label>

          <input
            type="number"
            step="0.01"
            class="form-control"
            formControlName="currentPrice">

        </div>

        <div class="col-md-4">

          <label class="form-label">

            Quantity

          </label>

          <input
            type="number"
            min="1"
            class="form-control"
            formControlName="quantity">

        </div>

      </div>

    </div>

    <!-- STATUS -->

    <div class="form-section">

      <h4>

        <i class="bi bi-bar-chart-fill me-2"></i>

        Investment Status

      </h4>

      <div class="row g-3">

        <div class="col-md-6">

          <label class="form-label">

            Purchase Date

          </label>

          <input
            type="date"
            class="form-control"
            formControlName="purchaseDate">

        </div>

        <div class="col-md-6">

          <label class="form-label">

            Status

          </label>

          <select
            class="form-select"
            formControlName="status">

            <option value="">Select Status</option>

            <option value="Active">

              Active

            </option>

            <option value="Sold">

              Sold

            </option>

          </select>

        </div>

      </div>

    </div>

    <!-- ERROR -->

    <div
      *ngIf="errorMessage"
      class="alert alert-danger">

      {{ errorMessage }}

    </div>

    <!-- ACTION BUTTONS -->

    <div class="action-buttons">

      <button
        type="submit"
        class="btn-save"
        [disabled]="editForm.invalid || loading">

        <span
          *ngIf="loading"
          class="spinner-border spinner-border-sm me-2">
        </span>

        <i
          *ngIf="!loading"
          class="bi bi-check-circle-fill me-2">
        </i>

        Update Investment

      </button>

      <button
        type="button"
        class="btn-view"
        routerLink="/adminnav/view-investment">

        <i class="bi bi-arrow-left-circle me-2"></i>

        Cancel

      </button>

    </div>

  </form>

</div>

<!-- ==========================================
     SUCCESS MODAL
========================================== -->

<div
  class="modal fade"
  [class.show]="showModal"
  [style.display]="showModal ? 'block' : 'none'"
  tabindex="-1">

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content success-modal">

      <div class="modal-body text-center p-5">

        <div class="success-icon">

          <i class="bi bi-check-circle-fill"></i>

        </div>

        <h3>

          Investment Updated

        </h3>

        <p>

          The investment details have been updated successfully.

        </p>

        <button
          class="btn-save mt-3"
          (click)="onOk()">

          Continue

        </button>

      </div>

    </div>

  </div>

</div>

<div
  *ngIf="showModal"
  class="modal-backdrop fade show">
</div>
